name: CI

on:
  push:
  pull_request:

jobs:
  someip-sd-loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync

      - name: Sanity-check imports
        run: uv run python -c "import someip_sd_demo.server, someip_sd_demo.client"

      - name: Verify IPv6 loopback is available on this runner
        run: |
          python3 -c "
          import socket
          s = socket.socket(socket.AF_INET6, socket.SOCK_DGRAM)
          s.bind(('::1', 0))
          print('AF_INET6 loopback OK:', s.getsockname())
          "

      - name: Offline SD wire round-trip check (no networking)
        # Builds the same OfferService/Subscribe entries and data
        # notifications server.py/client.py build, and confirms they
        # round-trip correctly through pysomeip's own SD serialize/parse.
        # Runs anywhere, including sandboxes with no IPv6 at all -- this is
        # the fast, deterministic part of "build and test"; the live run
        # below is the networked part.
        run: uv run python scripts/offline_roundtrip_check.py

      - name: Diagnose raw cross-process IPv6 multicast on this runner
        # Informational only (does not fail the build): GitHub-hosted
        # runners were found NOT to deliver IPv6 multicast on `lo` between
        # processes at all, independent of pysomeip -- confirmed with this
        # exact raw socket test (join succeeds, send succeeds, recv times
        # out with zero packets, even with the multicast route added and
        # IPV6_MULTICAST_LOOP explicitly enabled). That's why the live run
        # below uses --peer-addr (unicast SD) instead of real multicast.
        # Kept here so a future runner image change that fixes this is
        # visible without digging through history.
        continue-on-error: true
        run: |
          sudo ip -6 route add ff00::/8 dev lo || true
          python3 scripts/mcast_smoke_test.py recv > recv.log 2>&1 &
          RECV_PID=$!
          sleep 1
          python3 scripts/mcast_smoke_test.py send > send.log 2>&1 &
          SEND_PID=$!
          set +e
          wait $RECV_PID
          RECV_STATUS=$?
          set -e
          kill $SEND_PID 2>/dev/null || true
          echo "=== recv.log ==="; cat recv.log
          echo "=== send.log ==="; cat send.log
          if [ "$RECV_STATUS" = "0" ]; then
            echo "::notice::multicast now works on this runner -- the live run below could switch back to it"
          else
            echo "::notice::multicast still not delivered on this runner's lo, as expected; live run uses --peer-addr"
          fi

      - name: Run server and client live, unicast SD (CI fallback for no multicast)
        # See create_unicast_sd_endpoint in common.py: real sockets, real
        # asyncio, real pysomeip SD code and timing state machine, just
        # point-to-point instead of via multicast (which this runner can't
        # deliver at all -- see the diagnostic step above). The demo's
        # default (no --peer-addr) stays multicast-based, matching the real
        # vendor deployment, for local/self-hosted use.
        run: |
          uv run sd-server --peer-addr ::1 --log-level DEBUG > server.log 2>&1 &
          echo $! > server.pid
          sleep 1
          uv run sd-client --peer-addr ::1 --log-level DEBUG > client.log 2>&1 &
          echo $! > client.pid

          # Let the full Initial-Wait/Repetition/Main-phase SD handshake
          # play out and several notification cycles (~65ms cadence) run.
          # 45s (not 20s): the first CI run to reach this point showed
          # Status subscribing/refreshing cleanly every ~3s cycle while
          # Measurements' subscribe only succeeded once, right at the very
          # end of a 20s window -- more real run time is the cheapest way
          # to tell whether that's just a slow first success or a deeper,
          # per-service asymmetry worth root-causing separately.
          sleep 45

          # Graceful shutdown first (SIGINT, same path as local Ctrl+C:
          # StopOffer / unsubscribe), then force-kill as a safety net.
          kill -INT "$(cat client.pid)" "$(cat server.pid)" 2>/dev/null || true
          sleep 2
          kill -9 "$(cat client.pid)" "$(cat server.pid)" 2>/dev/null || true

      - name: Check expected SD + data sequence in logs
        run: |
          echo "=== server.log ==="; cat server.log
          echo
          echo "=== client.log ==="; cat client.log
          echo

          fail=0
          check() {
            local file="$1" pattern="$2" desc="$3"
            if ! grep -q "$pattern" "$file"; then
              echo "::error file=$file::missing expected log line: $desc (pattern: $pattern)"
              fail=1
            else
              echo "OK: $desc"
            fi
          }

          check server.log "offering Measurements" "server offers Measurements (0x60d4)"
          check server.log "offering Status" "server offers Status (0x60d6)"
          check server.log "SubscribeEventgroup accepted" "server accepted at least one subscribe"
          check server.log "sent notification" "server sent at least one notification"

          check client.log "discovered service=0x60d4" "client discovered Measurements"
          check client.log "discovered service=0x60d6" "client discovered Status"
          check client.log "received Subscribe ACK" "client saw a SubscribeAck (pysomeip's own log line)"
          check client.log "Measurements: received notification" "client received a Measurements notification"
          check client.log "Status: received notification" "client received a Status notification"
          check client.log "static session id, as documented" "Status's static session-id quirk observed on the wire"

          exit $fail

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: someip-sd-logs
          path: |
            server.log
            client.log
            recv.log
            send.log
