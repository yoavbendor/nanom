[project]
name = "someip-sd-demo"
version = "0.1.0"
description = "Local SOME/IP-SD server/client demo (pysomeip) for understanding AUTOSAR service discovery before the C++ port"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "someip>=0.3.0",
]

[project.scripts]
sd-server = "someip_sd_demo.server:main"
sd-client = "someip_sd_demo.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/someip_sd_demo"]
